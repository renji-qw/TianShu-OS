name: Build
on: [workflow_dispatch, push]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fix CRLF
        run: sed -i 's/\r$//' scripts/*.sh

      - name: Build
        run: docker run --rm --privileged -v "$PWD":/work -w /work archlinux:latest bash /work/scripts/ci-build.sh

      - name: Fix Perms
        run: sudo chown -R "$(id -u):$(id -g)" out/

      - name: Split & Release
        run: |
          set -euo pipefail
          TAG="v1.0.2-stable"
          REPO="${{ github.repository }}"

          # Release 单资产上限 2G，取 1.99 GB（1990000000 B，两种 2G 口径都留余量）
          # 阈值与切块同值：<=1.99G 直传，>1.99G 最多两片（覆盖到 3.98 GB）
          LIMIT=1990000000
          find out -maxdepth 1 -name "*.iso.xz" -size "+${LIMIT}c" \
            -exec split -b "$LIMIT" -d -a 2 {} {}.part- \; -exec rm -f {} \;

          cd out
          shopt -s nullglob
          files=(*)
          ((${#files[@]})
