name: TianShu OS
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 🚀 1. 开启 Rust 编译缓存
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          shared-key: tianshu-musl

      # 🚀 2. 开启 Arch 软件包缓存
      - name: Setup Pacman Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pacman
          key: ${{ runner.os }}-pacman-${{ hashFiles('configs/packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      # 🚀 3. 清理云端宿主机空间（防爆盘）
      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      # 🚀 4. 进入容器执行编译
      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          mkdir -p ~/.cache/pacman
          # 注意这里挂载了你的 pacman 缓存，实现增量
          docker run --rm --privileged \
            -v "$PWD":/work \
            -v "$HOME/.cache/pacman":/var/cache/pacman/pkg \
            -w /work -e WORKSPACE=/work \
            archlinux:latest bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      # 🚀 5. 修复 Docker 产生的权限问题
      - name: Fix Permissions
        run: sudo chown -R $(id -u):$(id -g) out/

      # 🚀 6. 极限压缩
      - name: Extreme Compress ISO
        run: |
          cd out
          for f in *.iso; do
            echo "使用系统自带 xz 极限压缩 $f..."
            xz -9e -T0 "$f"
          done
          ls -lh

      # 🚀 7. 保底上传 Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianShu-OS-ISO
          path: out/*.iso.xz
          if-no-files-found: error
          retention-days: 7

      # 🚀 8. 发布 Release（带强制覆盖）
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-lilac
          name: TianShu OS v1.0 紫丁香测试版
          files: out/*.iso.xz
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
