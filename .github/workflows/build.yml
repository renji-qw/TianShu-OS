name: TianShu OS
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged -v "$PWD":/work -w /work -e WORKSPACE=/work archlinux:latest bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      # 👇 新增：修复 Docker 产生的 root 权限文件，让 runner 能读取
      - name: Fix Permissions
        run: sudo chown -R $(id -u):$(id -g) out/

      - name: Extreme Compress ISO
        run: |
          cd out
          for f in *.iso; do
            echo "使用系统自带 xz 极限压缩 $f..."
            xz -9e -T0 "$f"
          done
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianShu-OS-ISO
          path: out/*.iso.xz
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-lilac
          name: TianShu OS v1.0 紫丁香测试版
          files: out/*.iso.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
