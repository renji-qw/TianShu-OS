name: TianShu OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 关键：job 级别不再挂 container，第一步跑在宿主机上，
      # 才能真正释放 runner 预装镜像占用的几十 GB，再把大工程交给 docker。
      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e WORKSPACE=/work \
            archlinux:latest \
            bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianShu-OS-ISO
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7
