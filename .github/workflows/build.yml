name: TianShu OS
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 🚀 1. 开启 Rust 编译缓存（只要你没改 Cargo.toml，编译秒过）
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          shared-key: tianshu-musl

      # 🚀 2. 开启 Arch 软件包缓存（避免每次重新下载几百个 KDE 包）
      - name: Setup Pacman Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pacman
          key: ${{ runner.os }}-pacman-${{ hashFiles('configs/packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modul
