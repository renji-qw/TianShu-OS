name: TianShu OS
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged -v "$PWD":/work -w /work -e WORKSPACE=/work archlinux:latest bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      - name: Fix Permissions
        run: sudo chown -R $(id -u):$(id -g) out/

      - name: Extreme Compress ISO
        run: |
          cd out
          for f in *.iso; do
            echo "使用系统自带 xz 极限压缩 $f..."
            xz -9e -T0 "$f"
          done
          ls -lh

      # ============ 双保险 1：上传到 Actions Artifact ============
      # 无论 Release 发不发得出去，这里永远能下包！
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianShu-OS-ISO
          path: out/*.iso.xz
          if-no-files-found: error
          retention-days: 7

      # ============ 双保险 2：发布到 Release ============
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-lilac
          name: TianShu OS v1.0 紫丁香测试版
          files: out/*.iso.xz    # 👈 极其重要：这里必须传 .xz，不能传 .iso，否则必超 2GB！
          overwrite: true        # 👈 极其重要：防止同名文件被跳过，导致拿到旧包！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
