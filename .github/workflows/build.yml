name: Build
on: [workflow_dispatch, push]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fix CRLF
        run: sed -i 's/\r$//' scripts/*.sh config/hooks/normal/* 2>/dev/null || true

      - name: Build
        run: docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash /work/scripts/ci-build.sh

      - name: Fix Perms
        run: sudo chown -R "$(id -u):$(id -g)" out/

      - name: Split & Release
        run: |
          set -eu
          TAG=v2.0.0-debian-alpha
          REPO="${{ github.repository }}"
          LIMIT=1990000000

          # Release 单资产上限 2G，取 1.99 GB；阈值与切块同值，最多两片
          find out -maxdepth 1 -name '*.iso.xz' -size "+${LIMIT}c" \
            -exec split -b "$LIMIT" -d -a 2 {} {}.part- \; -exec rm -f {} \;

          cd out
          ls -1 > /tmp/ts_files.txt
          if ! test -s /tmp/ts_files.txt; then
            echo '!! out/ 为空，没有产物可上传' >&2
            exit 1
          fi
          cat /tmp/ts_files.txt

          # gh release upload 不会自动建 Release，先确保它存在
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" \
              --target "${{ github.sha }}" \
              --title "TianShu OS $TAG" \
              --notes "Automated build from ${{ github.sha }}"
          fi

          while IFS= read -r f; do
            gh release upload "$TAG" "$f" -R "$REPO" --clobber
          done < /tmp/ts_files.txt

          gh release view "$TAG" -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
