name: TianShu OS

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: false
        type: string
        default: 'v1.0.1-beta'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          shared-key: tianshu-musl

      - name: Setup Pacman Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pacman
          key: ${{ runner.os }}-pacman-${{ hashFiles('configs/packages.x86_64', 'packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      # 若 ci-build.sh 已包含 cargo build，删掉这一步
      - name: Build tianshu_core (musl static)
        working-directory: core
        run: |
          set -euxo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/tianshu_core
          ls -lh target/x86_64-unknown-linux-musl/release/tianshu_core

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          mkdir -p ~/.cache/pacman out
          docker run --rm --privileged \
            -v "$PWD":/work \
            -v "$HOME/.cache/pacman":/var/cache/pacman/pkg \
            -w /work -e WORKSPACE=/work \
            archlinux:latest bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      - name: Fix Permissions
        run: sudo chown -R $(id -u):$(id -g) out/

      - name: Inspect airootfs size
        if: always()
        run: |
          set -euxo pipefail
          if [ -d airootfs ]; then
            echo "### airootfs top 40" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            du -xh airootfs 2>/dev/null | sort -h | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extreme Compress ISO
        run: |
          set -euxo pipefail
          cd out
          for f in *.iso; do
            BEFORE=$(stat -c%s "$f")
            echo "压缩前: $f ($(numfmt --to=iec "$BEFORE"))"
            # BCJ x86 过滤 + lc=4/pb=0 + 256MiB 块：外层 xz 能拧到的最紧
            xz -T0 --memlimit-compress=80% --x86 \
               --lzma2=preset=9e,lc=4,lp=0,pb=0 \
               --block-size=256MiB \
               -v "$f"
            AFTER=$(stat -c%s "$f.xz")
            echo "$f: $(numfmt --to=iec "$BEFORE") -> $(numfmt --to=iec "$AFTER")" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done
          sha256sum *.iso.xz > SHA256SUMS
          ls -lh

      # 先不切片；超限直接红叉
      - name: Enforce GitHub Release 2GB limit
        run: |
          set -euxo pipefail
          LIMIT=2147483648
          FILE=$(find out -maxdepth 1 -name '*.iso.xz' -print -quit)
          test -n "$FILE"
          SIZE=$(stat -c%s "$FILE")
          echo "镜像大小: $SIZE bytes ($(numfmt --to=iec "$SIZE"))" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::ISO.xz 超过 2GB（$SIZE >= $LIMIT）。继续精简或改回 split 切片。"
            exit 1
          fi

      - name: Upload diagnostic artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tianshu-build-diagnostics
          path: |
            out/*.iso.xz
            out/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: TianShu OS ${{ github.event.inputs.tag }}
          files: |
            out/*.iso.xz
            out/SHA256SUMS
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
