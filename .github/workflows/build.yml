name: TianShu Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Build Script
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work archlinux:latest bash /work/scripts/ci-build.sh

      - name: Fix Permissions
        run: sudo chown -R $(id -u):$(id -g) out/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-beta
          name: TianShu OS v1.0.1-beta
          files: out/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
