name: TianShu OS
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space on host
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules \
            /opt/az /usr/local/aws-cli 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /

      - name: Build ISO in Arch container
        run: |
          set -euo pipefail
          docker pull archlinux:latest
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e WORKSPACE=/work \
            archlinux:latest \
            bash /work/scripts/ci-build.sh
          ls -lh out/
          df -h /

      # 👇 新增：在宿主机上用 7z 进行极限二次压缩
      - name: Extreme Compress ISO
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          cd out
          for f in *.iso; do
            echo "极限压缩 $f..."
            # 使用 LZMA2 算法，最高压缩级别 9，多线程
            7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "${f}.7z" "$f"
            # 压缩完成后删掉原 ISO，防止占用多余空间
            rm -f "$f"
          done
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianShu-OS-ISO
          path: out/*.7z  # 👈 改为上传 7z 压缩包
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-lilac
          name: TianShu OS v1.0 紫丁香测试版
          files: out/*.7z  # 👈 改为发布 7z 压缩包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
