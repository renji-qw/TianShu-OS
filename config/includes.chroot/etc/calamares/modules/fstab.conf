---
# fstab：btrfs 压缩 + noatime，swap 走 zram
btrfs:
    compress: "zstd"
    space: "lzo"
    subvolumes:
        - { mountPoint: "@", label: "root", options: [ "subvol=@", "compress=zstd", "noatime" ] }
        - { mountPoint: "/home", label: "home", options: [ "subvol=@home", "compress=zstd", "noatime" ] }
        - { mountPoint: "/var", label: "var", options: [ "subvol=@var", "compress=zstd", "noatime" ] }
    mountOptions: [ "compress=zstd", "noatime" ]
mountOptions:
    - [ "btrfs", "compress=zstd", "noatime" ]
swap:
    zramEnabled: true
    zramSize: 50%
