---
# Btrfs + 快照：与 README「基·筑基」叙事一致
defaultLayout: btrfs
efiSystemPartition: /boot/efi
efiSystemPartitionSize: 512MB
efiSystemPartitionMountPoint: /boot/efi
rootLayout:
  - type: btrfs
    mountPoint: /
    label: root
    size: 8GB
    filesystem: btrfs
    mountOptions: [ "compress=zstd", "noatime" ]
  - type: linuxswap
    mountPoint: swap
    label: swap
    size: 2GB
    filesystem: linuxswap
  - type: btrfs
    mountPoint: /home
    label: home
    size: 0
    filesystem: btrfs
    mountOptions: [ "compress=zstd", "noatime" ]
