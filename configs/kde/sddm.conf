[Theme]
Current=tianshu
CursorTheme=breeze_cursors
Font=Noto Sans CJK SC,10,-1,5,50,0,0,0,0,0

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on

[Users]
MaximumUid=60000
MinimumUid=1000
HideUsers=
HideShells=/usr/bin/nologin,/sbin/nologin,/bin/false

[Autologin]
Relogin=false
Session=
User=
