[package]
name = "tianshu_core"
version = "1.0.1-beta"          # semver 预发布，不能写 1.0.1BETA
edition = "2021"
rust-version = "1.89"           # avx512f target_feature 在 1.89 稳定
license = "AGPL-3.0-only"
description = "TianShu OS 1.0.1BETA emergent dynamics scheduling core"
repository = "https://github.com/renji-qw/TianShu-OS"

[dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"
sysinfo = "=0.30.13"
ctrlc = "3.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"
